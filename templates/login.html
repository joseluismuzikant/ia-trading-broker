{% extends "base.html" %}
{% block title %}Sign in &middot; ia-trading-broker{% endblock %}

{% block content %}
<section class="card card--auth">
  <h1>Sign in</h1>
  <p class="muted">Use the account created for this installation.</p>

  {% if error %}
  <p class="alert alert--error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

    <label class="field">
      <span class="field__label">Username</span>
      <input
        class="field__input"
        type="text"
        name="username"
        required
        autofocus
        autocomplete="username"
        maxlength="64"
      />
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input
        class="field__input"
        type="password"
        name="password"
        required
        autocomplete="current-password"
      />
    </label>

    <button type="submit" class="button">Sign in</button>
  </form>
</section>
{% endblock %}
