# Hard portfolio limits. The risk manager refuses any order that would break
# one of them, and the review page shows which limit stopped an order.
[portfolio_constraints]
max_open_positions = 8
max_argentina_stock_positions = 4
max_cedear_positions = 3
max_bond_positions = 2
max_single_position_pct = 0.15
min_cash_pct = 0.10
max_trades_per_run = 3

# Width of the analysis funnel: how many instruments each stage may keep.
[selection]
candidates_min = 10
candidates_max = 12
finalists = 5
