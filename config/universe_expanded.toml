# The trading universe and the portfolio limits.
#
# This file is the single source of truth for which instruments the project
# considers. Nothing in the code names a symbol: edit here to change the
# universe. Each entry maps the ticker to its paper name, which is what the
# analysis pages show.
#
#   SYMBOL = "Paper name"
#
# Every category may declare the market its symbols are quoted on; the value
# defaults to BCBA when it is left out.

[universe.argentina_stocks]
market = "BCBA"

# Existing universe plus the additional peso-denominated Argentine shares
# supplied from the IOL market list. Dollar-settlement aliases ending in D
# are intentionally not duplicated here.
