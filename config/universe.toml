# The trading universe and the portfolio limits.
#
# This file is the single source of truth for which instruments the project
# considers. Nothing in the code names a symbol: edit here to change the
# universe. Each entry maps the ticker to its paper name, which is what the
# analysis pages show.
#
#   SYMBOL = "Paper name"
#
# Every category may declare the market its symbols are quoted on; the value
# defaults to BCBA when it is left out.
#
# A category may also declare how its quotes must be read:
#
#   quotation_factor         how many units one quote covers (1 for stocks
#                            and CEDEARs, 100 for sovereign bonds). One unit
#                            costs quoted_price / factor and an order moves
#                            quoted_price * quantity / factor. The order sent
#                            to IOL keeps the quoted price unchanged.
#   min_quantity             smallest quantity IOL accepts (nominales for a
#                            bond). 0 means none is declared.
#   live_quantity_confirmed  whether the meaning of the API "cantidad" field
#                            for this category has been verified. When false,
#                            live orders for the category are blocked instead
#                            of guessed.

[universe.argentina_stocks]
market = "BCBA"

# Argentine equities from IOL's main and Panel General equity lists.
# Currency/settlement aliases such as GGALD, YPFDD, CRESD, IRSAD, etc. are
