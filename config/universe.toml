[universe.bonds]
market = "BCBA"
# IOL quotes sovereign bonds per 100 nominales: a quote of 85.800 is 85.800
# per 100 nominales, so one nominal costs 858. The order price sent to IOL is
# the quoted price; only the sizing divides by this factor.
quotation_factor = 100
# `cantidad` is the amount of units — nominales for a bond, shares for a
# stock. Verified against the live account, so live bond orders are enabled.
live_quantity_confirmed = true
# Smallest nominal amount IOL accepts for these bonds. 0 = none declared, so
# no artificial floor is imposed. Set it if the broker enforces one.
min_quantity = 0

# Main USD sovereign bond families, split between Argentine-law (AL/AE)
# and New York-law (GD) instruments.
[universe.bonds.instruments]
AL29 = "Bonar 2029"
AL30 = "Bonar 2030"
AL35 = "Bonar 2035"
AE38 = "Bonar 2038"
AL41 = "Bonar 2041"
GD29 = "Global 2029"
GD30 = "Global 2030"
GD35 = "Global 2035"
GD38 = "Global 2038"
GD41 = "Global 2041"

# Hard portfolio limits. The risk manager refuses any order that would break
# one of them, and the review page shows which limit stopped an order.
[portfolio_constraints]
max_open_positions = 8
max_argentina_stock_positions = 4
max_cedear_positions = 3
max_bond_positions = 2
max_single_position_pct = 0.15
min_cash_pct = 0.10
max_trades_per_run = 3

# Width of the analysis funnel: how many instruments each stage may keep.
[selection]
candidates_min = 10
candidates_max = 12
finalists = 5
